[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wmmon"
version = "0.1.0"
description = "Components-of-variance charts for compositional classifier output"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Muhammad Imran", email = "kharal@tju.edu.cn"},
    {name = "Zhen He", email = "258090@tju.edu.cn"},
    {name = "Fatima Sehar Zaidi", email = "fatimasehar@gzhu.edu.cn"},
]
keywords = [
    "statistical process control",
    "compositional data",
    "components of variance",
    "overdispersion",
    "concept drift",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

# The chart needs these three: numpy and scipy for the numerics, pandas because
# wmmon.composition returns the per-unit stream as a DataFrame. torch, river,
# scikit-image and scikit-learn are required by the inspection models, the
# auxiliary datasets, the wafer-map feature extractor and the classifiers
# respectively, not by wmmon.varcomp or wmmon.laney_coda, so they are extras  - 
# someone who wants the method should not have to install a deep-learning stack
# to get it.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
experiments = [
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "scikit-image>=0.21",
]
cnn = ["torch>=2.0"]
auxiliary = ["river>=0.20"]
all = ["wmmon[experiments,cnn,auxiliary]"]

[project.urls]
Repository = "https://github.com/kharal768/compositional-variance-charts"

[tool.setuptools]
packages = ["wmmon"]

[tool.setuptools.package-data]
wmmon = ["py.typed"]
